<style>
:root{
  /* Brand-derived palette: deep navy, sky blue, slate text, sand accent */
  --navy:#085389; --sky:#489FD8; --sky-l:#9FD0F0; --sand:#D8CFA6;
  --paper:#FFFFFF; --card:#F8FAFB; --raise:#FFFFFF; --line:#DCE2E7;
  --ink:#314650; --slate:#6B7E88; --accent:#085389;
  --btn:#085389; --btn-ink:#FFFFFF;
  --pale:#E6F2FB; --pale-line:#BFDDF2;
  --sand-soft:#F6F2E4; --sand-line:#E3DBBB; --sand-ink:#6A5E2E;
  --th:#EEF3F6; --press:#EEF3F6; --navbg:rgba(255,255,255,.96);
  --dose-bg:#E6F2FB; --dose-ink:#085389;
  --red:#B3261E; --red-soft:#FBECEB; --red-line:#EBC5C2;
  --green:#1B7A43; --green-soft:#E7F4EC; --green-line:#BBDCC7;
  --amber:#A66A00;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:12px; --tabbar:calc(66px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --paper:#0A1C2A; --card:#10283A; --raise:#14324A; --line:#254559;
    --ink:#E3ECF2; --slate:#9FB3C1; --accent:#9FD0F0;
    --btn:#1973B4; --btn-ink:#FFFFFF;
    --pale:#143B58; --pale-line:#22587F;
    --sand-soft:#2B2819; --sand-line:#4B4527; --sand-ink:#E4DBB4;
    --th:#16334A; --press:#16334A; --navbg:rgba(10,28,42,.96);
    --dose-bg:#143B58; --dose-ink:#CFE8F8;
    --red:#F0A19B; --red-soft:#35181A; --red-line:#6B2B27;
    --green:#7FD3A0; --green-soft:#13301F; --green-line:#285C3D;
    --amber:#E3B45C;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100%;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
/* signature gradient rule across the very top (also fills the iOS status-bar area) */
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 5px);
  background:linear-gradient(90deg,var(--navy),var(--sky));z-index:110}
#app{max-width:680px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px var(--tabbar)}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink);
  padding-bottom:9px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--navy),var(--sky)) left bottom/100% 3px no-repeat}
h2{font-size:18px;font-weight:700;margin:22px 0 10px}
h3{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
h3::before{content:"";display:block;width:28px;height:3px;border-radius:2px;background:var(--sky);margin-bottom:7px}
.card>h3:first-child{margin-top:2px}
p{margin:6px 0}
button{font-family:inherit;border:none;cursor:pointer;background:none;font-size:inherit;color:inherit}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--slate)}
.hero{position:relative;overflow:hidden;margin:-4px -16px 4px;padding:4px 16px 0}
.hero::after{content:"";position:absolute;right:-6px;top:-10px;width:190px;height:120px;pointer-events:none;
  background:radial-gradient(circle,var(--sky-l) 0 3px,transparent 3.6px) 0 0/15px 15px;opacity:.75;
  -webkit-mask-image:radial-gradient(ellipse at 100% 0,#000 8%,transparent 72%);
  mask-image:radial-gradient(ellipse at 100% 0,#000 8%,transparent 72%)}
.hero>*{position:relative;z-index:1}
.brand h1{font-size:30px;color:var(--accent);margin-top:2px}
.sub{color:var(--slate);font-size:13.5px;margin-bottom:14px}
.qtext{font-size:17px;font-weight:700;line-height:1.4;margin:4px 0 8px}
/* ---- cards / chips ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;background:var(--pale);color:var(--accent)}
.tag.blue{background:var(--sky-l);color:#06395F}
.tag.amber{background:var(--sand-soft);color:var(--sand-ink)}
.tag.red{background:var(--btn);color:#fff}
.tag.green{background:var(--th);color:var(--ink)}
.dose{font-size:14px;font-weight:700;background:var(--dose-bg);color:var(--dose-ink);
  padding:1px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.k911{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;background:#C62828;color:#fff;
  padding:1px 8px;border-radius:999px;white-space:nowrap}
.warn{background:var(--sand-soft);border:1px solid var(--sand-line);border-left:4px solid var(--sand);
  border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.crit{background:var(--red-soft);border:1px solid var(--red-line);border-left:4px solid #C62828;
  border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.policy{background:var(--btn);color:#fff;border-radius:var(--r);padding:13px 14px;font-size:14.5px;margin:10px 0}
.policy b.lbl{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sand);margin-bottom:3px}
.policy .dose{background:#fff;color:#085389}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:4px 0}
li::marker{color:var(--sky);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--th);font-weight:700}
.tblwrap{overflow-x:auto}
/* severity cards (mild / moderate / severe) */
.sevgrid{display:grid;gap:8px;margin:8px 0}
.sevcard{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sevcard ul{margin:8px 0 0}
.sev{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 16px;border-radius:999px}
.sev.mild{background:#9FD0F0;color:#06395F}
.sev.mod{background:#489FD8;color:#fff}
.sev.sv{background:#085389;color:#fff}
@media (prefers-color-scheme:dark){.sev.sv{background:#1973B4}}
/* ---- tab bar ---- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;max-width:680px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
nav button.on{color:var(--accent)}
nav button svg{width:24px;height:24px}
nav button.em{color:var(--accent)}
nav button.em svg{width:34px;height:34px;padding:6px;border-radius:50%;background:var(--btn);color:#fff;margin-top:-8px}
/* ---- home grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;
  text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:96px}
.tile b{font-size:15.5px;line-height:1.3}
.tile span:not(.tag){font-size:12.5px;color:var(--slate);line-height:1.35}
.tile:active{background:var(--press)}
/* ---- buttons ---- */
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;font-weight:700;font-size:15px;margin:8px 0}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:var(--raise);border:1.5px solid var(--line);color:var(--ink)}
.btn:active{opacity:.85}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:14.5px;padding:6px 0;margin-bottom:4px}
.score{font-size:44px;font-weight:700}
/* ---- quick-reference mode (always deep navy) ---- */
.em-wrap{position:fixed;inset:0;background:#062B47;color:#fff;z-index:100;overflow-y:auto;color-scheme:dark;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.em-wrap .inner{max-width:680px;margin:0 auto}
.em-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.em-title{font-size:20px;font-weight:700;letter-spacing:.02em}
.em-sub{color:#BBD9EE;font-size:13.5px;margin:2px 0 8px}
.em-note{font-size:11.5px;color:#8FB6D2;margin-top:14px}
.em-close{background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;font-size:14px}
.em-btn{display:block;width:100%;text-align:left;background:#0A3F68;border:1px solid #1C5F93;color:#fff;
  border-radius:12px;padding:15px 16px;margin:8px 0;font-size:17px;font-weight:700}
.em-btn small{display:block;font-weight:400;font-size:13px;color:#BBD9EE;margin-top:2px}
.em-btn:active{background:#0E4D7E}
.em-btn.center{text-align:center}
.em-group{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#D8CFA6;margin:18px 2px 2px}
.em-card{background:#083655;border:1px solid #1C5F93;border-radius:12px;padding:14px;margin:10px 0}
.em-card h3{color:#D8CFA6;font-size:12px;letter-spacing:.14em;margin:0 0 8px}
.em-card h3::before{display:none}
.em-card li{margin:7px 0;font-size:15.5px}
.em-card .dose,.em-step .dose{background:#fff;color:#085389}
.em-step{display:flex;gap:10px;margin:11px 0;font-size:15.5px;line-height:1.45}
.em-step .n{flex:none;width:26px;height:26px;border-radius:50%;background:#489FD8;color:#fff;
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13.5px}
.wt-bar{display:flex;align-items:center;gap:8px;background:#083655;border:1px solid #1C5F93;border-radius:12px;padding:10px 12px;margin:8px 0}
.wt-bar input{width:70px;background:#fff;color:#085389;border:none;border-radius:8px;padding:8px;font-size:16px;font-weight:700;text-align:center;font-family:inherit}
.wt-bar label{font-size:13.5px;color:#BBD9EE;font-weight:700}
.calc{color:#D8CFA6;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* ---- NIHSS ---- */
.nih-score{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  background:#fff;color:#085389;border-radius:12px;padding:10px 14px;margin:8px 0;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.nih-score b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.nih-score span{font-size:13px;font-weight:700;line-height:1.3;color:#314650}
.nih-opts{display:flex;flex-direction:column;gap:6px}
.nih-opt{text-align:left;background:#0A3F68;border:1px solid #1C5F93;color:#DCEBF5;
  border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.35}
.nih-opt.on{background:#fff;border-color:#fff;color:#085389;font-weight:700}
.nih-opt:active{opacity:.8}
/* ---- flashcards ---- */
.fc-stage{perspective:1200px;margin:14px 0}
.fc{position:relative;width:100%;min-height:250px;transform-style:preserve-3d;transition:transform .45s}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sky);border-radius:var(--r);padding:22px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.fc-face.b{transform:rotateY(180deg);background:var(--pale);border-color:var(--pale-line);border-top-color:var(--navy)}
.fc-face .q{font-size:18px;font-weight:700;line-height:1.4}
.fc-face .a{font-size:16px;line-height:1.5}
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--slate);margin:6px 2px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--raise);
  font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.pill.on{background:var(--btn);border-color:var(--btn);color:#fff}
/* ---- scenarios ---- */
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.vt{background:#085389;color:#fff;border-radius:10px;padding:8px;text-align:center}
.vt b{font-size:16px;display:block;font-variant-numeric:tabular-nums}
.vt span{font-size:10px;color:#BBD9EE;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--raise);border:1.5px solid var(--line);
  border-radius:var(--r);padding:13px 14px;margin:7px 0;font-size:15px;line-height:1.4}
.opt:active{background:var(--press)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.fb.good{background:var(--green-soft);border:1px solid var(--green-line)}
.fb.bad{background:var(--red-soft);border:1px solid var(--red-line)}
.progress{height:5px;background:var(--line);border-radius:99px;margin:8px 0;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--sky));border-radius:99px;transition:width .3s}
.hidden{display:none}
footer.note{font-size:11.5px;color:var(--slate);margin:24px 0 8px;line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
footer.note b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.fc,.progress i{transition:none}}
</style>

<nav id="tabbar">

  <button data-tab="quick" class="em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>Quick Ref</button>

<script>
/* =========================================================
   CodeReady — single-file PWA
   Education + quick reference: ACLS / PALS / ATLS /
   contrast safety / moderate sedation
   Unofficial personal reference; visual styling inspired by Lumexa Imaging.
   Not an official Lumexa Imaging product and not endorsed by the company.
   ========================================================= */
"use strict";

/* ---------- tiny safe storage (works deployed; silent in sandboxed previews) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const D=s=>`<span class="dose">${s}</span>`; // dose chip
const K='<span class="k911">CALL 911</span>'; // escalation chip

/* =========================================================
   LEARN CONTENT
   ========================================================= */
const LEARN={
acls:{name:"ACLS",tag:"teal",blurb:"Adult cardiac arrest, bradycardia, tachycardia, post-ROSC (AHA 2020).",
sections:[
{t:"Adult Cardiac Arrest (VF / pVT)",h:`
<p><b>Shockable rhythms.</b> Survival hinges on high-quality CPR and early defibrillation.</p>
<ol>
<li>Start CPR — rate ${D("100–120/min")}, depth ${D("2–2.4 in (5–6 cm)")}, full recoil, minimize pauses (&lt;10 s).</li>
<li>Attach defibrillator. <b>Shock</b>: biphasic ${D("120–200 J")} (per device; max if unknown).</li>
<li>CPR 2 min → rhythm check → shock if still VF/pVT.</li>
<li><b>Epinephrine</b> ${D("1 mg IV/IO q3–5 min")} after the 2nd shock.</li>
<li><b>Amiodarone</b> ${D("300 mg IV bolus")}, repeat ${D("150 mg")} once — or <b>lidocaine</b> ${D("1–1.5 mg/kg")}, then ${D("0.5–0.75 mg/kg")}.</li>
<li>Advanced airway → continuous compressions + 1 breath q6 s; waveform capnography (target ETCO₂ &gt;10, ideally &gt;20 mmHg).</li>
</ol>
<div class="warn"><b>Reversible causes — Hs &amp; Ts:</b> Hypovolemia, Hypoxia, H⁺ (acidosis), Hypo/Hyperkalemia, Hypothermia · Tension pneumothorax, Tamponade, Toxins, Thrombosis (PE), Thrombosis (MI).</div>`},
{t:"Adult Cardiac Arrest (Asystole / PEA)",h:`
<p><b>Non-shockable.</b> CPR + epinephrine ASAP; find and fix the cause.</p>
<ol>
<li>CPR immediately; rhythm check q2 min.</li>
<li><b>Epinephrine</b> ${D("1 mg IV/IO q3–5 min")} — give as early as possible.</li>
<li>No shocks; no amiodarone. Aggressively work the Hs &amp; Ts (PEA is a "cause" rhythm).</li>
<li>Narrow-complex PEA → think mechanical (tamponade, tension PTX, PE, hypovolemia). Wide-complex → think metabolic/toxic (hyperK, Na-channel blockade).</li>
</ol>`},
{t:"Bradycardia (with pulse)",h:`
<p>Treat only if <b>symptomatic</b> (hypotension, altered mental status, shock, ischemic chest pain, acute heart failure).</p>
<ol>
<li><b>Atropine</b> ${D("1 mg IV q3–5 min, max 3 mg")}.</li>
<li>If ineffective: <b>transcutaneous pacing</b>, or <b>dopamine</b> ${D("5–20 mcg/kg/min")}, or <b>epinephrine infusion</b> ${D("2–10 mcg/min")}.</li>
<li>Mobitz II / 3rd-degree block: atropine often fails — move to pacing early; prepare transvenous pacing.</li>
</ol>`},
{t:"Tachycardia (with pulse)",h:`
<p>First question: <b>stable or unstable?</b></p>
<h3>Unstable → synchronized cardioversion</h3>
<ul>
<li>Narrow regular (SVT/flutter): ${D("50–100 J")}</li>
<li>Narrow irregular (AF): ${D("120–200 J biphasic")}</li>
<li>Wide regular (VT): ${D("100 J")}</li>
<li>Consider sedation if time permits; never delay for an unstable patient.</li>
</ul>
<h3>Stable</h3>
<ul>
<li>Narrow regular: vagal maneuvers → <b>adenosine</b> ${D("6 mg rapid IV push")}, then ${D("12 mg")} → β-blocker / Ca-channel blocker.</li>
<li>Wide regular (likely VT): <b>amiodarone</b> ${D("150 mg IV over 10 min")} or procainamide; adenosine acceptable if regular + monomorphic.</li>
<li>Polymorphic VT / torsades: defibrillate if pulseless; <b>magnesium</b> ${D("1–2 g IV")} for torsades.</li>
</ul>`},
{t:"Acute Stroke (Suspected)",h:`
<p><b>Time is brain.</b> Establish <b>last known well (LKW)</b> immediately — every decision keys off it.</p>
<h3>Recognition</h3>
<ul><li><b>BE-FAST:</b> Balance, Eyes (vision loss/diplopia), Face droop, Arm drift, Speech, Time. Severity scored by NIHSS.</li>
<li>Check <b>glucose</b> — hypoglycemia (&lt;60 mg/dL) is the great mimic. Also consider seizure/Todd's, migraine, mass.</li></ul>
<h3>Acute pathway (AHA stroke chain)</h3>
<ol>
<li>Activate stroke team; targets: door-to-CT ≤ ${D("20–25 min")}, door-to-needle ≤ ${D("60 min")} (ideal ≤45).</li>
<li><b>Non-contrast head CT</b> to exclude hemorrhage; CTA head/neck for LVO ± CT perfusion in extended windows.</li>
<li>O₂ only if SpO₂ &lt;94%; treat fever and glucose (target 140–180).</li>
</ol>
<h3>IV Thrombolysis (no hemorrhage, within window)</h3>
<ul>
<li>Window: ${D("≤ 3 h")} from LKW; extended ${D("3–4.5 h")} for selected patients.</li>
<li><b>Alteplase</b> ${D("0.9 mg/kg (max 90 mg)")} — 10% IV bolus over 1 min, remainder over 60 min. <b>Tenecteplase</b> ${D("0.25 mg/kg (max 25 mg)")} single bolus is an accepted alternative (esp. before thrombectomy).</li>
<li>BP must be ${D("< 185/110")} before lytics (labetalol ${D("10–20 mg IV")} or nicardipine gtt ${D("5 mg/h, titrate")}); keep ${D("< 180/105")} for 24 h after.</li>
<li>Key exclusions: hemorrhage on CT, recent major surgery/bleed, anticoagulated (INR &gt;1.7, DOAC &lt;48 h), platelets &lt;100k, prior ICH.</li>
</ul>
<h3>Thrombectomy</h3>
<ul><li>LVO (ICA, M1 ± M2, basilar): endovascular thrombectomy up to ${D("24 h")} from LKW in selected patients (DAWN / DEFUSE-3 imaging criteria). Lytics first if eligible — don't delay transfer.</li></ul>
<div class="crit"><b>Not a lytic candidate?</b> Permissive hypertension — treat BP only if ${D("> 220/120")} (or other emergency indication). Aggressive lowering worsens penumbral perfusion.</div>
<div class="warn"><b>Post-lytic deterioration</b> (headache, vomiting, ↓LOC, BP spike) = suspected ICH → stop infusion, stat non-contrast CT, labs (fibrinogen), cryoprecipitate ${D("10 units")} + reverse, neurosurgery consult.</div>`},
{t:"Post-ROSC Care",h:`
<ul>
<li>Airway + ventilation: SpO₂ ${D("92–98%")}, PaCO₂ ${D("35–45 mmHg")}; avoid hyperoxia and hyperventilation.</li>
<li>BP: keep SBP ${D("> 90 mmHg")} / MAP ${D("> 65 mmHg")} (fluids, vasopressors).</li>
<li>12-lead ECG → STEMI → emergent cath lab.</li>
<li>Comatose → targeted temperature management ${D("32–37.5 °C")} for ≥24 h; treat fever.</li>
<li>Check glucose, electrolytes; avoid prognostication &lt;72 h post-normothermia.</li>
</ul>`}]},

pals:{name:"PALS",tag:"blue",blurb:"Pediatric arrest, bradycardia, tachycardia — weight-based dosing (AHA 2020).",
sections:[
{t:"Pediatric Cardiac Arrest",h:`
<ol>
<li>CPR: ${D("100–120/min")}, depth ⅓ AP chest (~${D("4 cm infant, 5 cm child")}); 15:2 with 2 rescuers (30:2 single).</li>
<li><b>Defibrillation (VF/pVT):</b> ${D("2 J/kg")} → ${D("4 J/kg")} → subsequent ≥4 J/kg, max ${D("10 J/kg")} or adult dose.</li>
<li><b>Epinephrine</b> ${D("0.01 mg/kg IV/IO (0.1 mL/kg of 0.1 mg/mL)")} q3–5 min — give within 5 min for non-shockable rhythms.</li>
<li><b>Amiodarone</b> ${D("5 mg/kg bolus")} (may repeat ×2) or <b>lidocaine</b> ${D("1 mg/kg")} for refractory VF/pVT.</li>
<li>With advanced airway: 1 breath q2–3 s (20–30/min).</li>
</ol>
<div class="warn">Pediatric arrest is usually <b>asphyxial</b> — oxygenation and ventilation matter more than in adults.</div>`},
{t:"Pediatric Bradycardia",h:`
<ol>
<li>HR &lt;60 with poor perfusion <b>despite</b> oxygenation/ventilation → <b>start CPR</b>.</li>
<li><b>Epinephrine</b> ${D("0.01 mg/kg IV/IO q3–5 min")}.</li>
<li><b>Atropine</b> ${D("0.02 mg/kg")} (max ${D("0.5 mg")}/dose) for increased vagal tone or primary AV block.</li>
<li>Consider pacing for complete heart block / sinus node dysfunction.</li>
</ol>`},
{t:"Pediatric Tachycardia",h:`
<h3>SVT (infant HR usually &gt;220; child &gt;180, no rate variability, abrupt onset)</h3>
<ul>
<li>Vagal maneuvers (ice to face in infants).</li>
<li><b>Adenosine</b> ${D("0.1 mg/kg rapid IV (max 6 mg)")} → second dose ${D("0.2 mg/kg (max 12 mg)")}.</li>
<li>Unstable → <b>synchronized cardioversion</b> ${D("0.5–1 J/kg")}, then ${D("2 J/kg")}.</li>
</ul>
<h3>Wide-complex (VT with pulse)</h3>
<ul><li>Unstable → cardioversion. Stable → expert consult; amiodarone ${D("5 mg/kg over 20–60 min")} or procainamide.</li></ul>`},
{t:"Quick Peds Numbers",h:`
<table><tr><th>Item</th><th>Value</th></tr>
<tr><td>Fluid bolus</td><td>${D("10–20 mL/kg")} isotonic crystalloid (10 mL/kg if cardiac concern; reassess)</td></tr>
<tr><td>Glucose (D10)</td><td>${D("5 mL/kg IV")} for hypoglycemia</td></tr>
<tr><td>ETT size (cuffed)</td><td>${D("age/4 + 3.5")}</td></tr>
<tr><td>Weight estimate</td><td>${D("(age × 2) + 8 kg")} (or length-based tape)</td></tr>
<tr><td>Hypotension (SBP)</td><td>${D("< 70 + (age × 2) mmHg")} (1–10 y)</td></tr></table>`}]},

atls:{name:"ATLS",tag:"amber",blurb:"Primary survey, shock classes, GCS, hemorrhage control (ATLS 10th ed.).",
sections:[
{t:"Primary Survey — ABCDE",h:`
<ol>
<li><b>A — Airway</b> + cervical spine protection. Talking = patent. GCS ≤8 → definitive airway.</li>
<li><b>B — Breathing</b>: expose chest; look for tension pneumothorax (→ immediate needle/finger decompression, 5th ICS anterior axillary line), open PTX, flail chest, massive hemothorax.</li>
<li><b>C — Circulation</b>: control external hemorrhage (direct pressure → tourniquet), 2 large-bore IVs, ${D("1 L warmed crystalloid")} then early blood. Permissive hypotension if no TBI.</li>
<li><b>D — Disability</b>: GCS, pupils, glucose, lateralizing signs.</li>
<li><b>E — Exposure</b>: fully undress, prevent hypothermia (warm blankets, warm fluids).</li>
</ol>
<div class="crit"><b>Lethal triad:</b> hypothermia + acidosis + coagulopathy — every intervention should avoid feeding it.</div>`},
{t:"Hemorrhagic Shock Classes",h:`
<table><tr><th></th><th>I</th><th>II</th><th>III</th><th>IV</th></tr>
<tr><td>Blood loss</td><td>&lt;15%</td><td>15–30%</td><td>31–40%</td><td>&gt;40%</td></tr>
<tr><td>HR</td><td>↔</td><td>↑</td><td>↑↑</td><td>↑↑↑</td></tr>
<tr><td>BP</td><td>↔</td><td>↔</td><td>↓</td><td>↓↓</td></tr>
<tr><td>Mental status</td><td>Slightly anxious</td><td>Anxious</td><td>Confused</td><td>Lethargic</td></tr>
<tr><td>Resuscitation</td><td>Crystalloid</td><td>Crystalloid ± blood</td><td>Blood</td><td>Blood + MTP</td></tr></table>
<ul>
<li><b>Massive transfusion:</b> balanced ${D("1:1:1")} (plasma : platelets : RBC).</li>
<li><b>TXA</b> ${D("1 g IV over 10 min")} within 3 h of injury, then ${D("1 g over 8 h")}.</li>
</ul>`},
{t:"Glasgow Coma Scale",h:`
<table><tr><th>Eyes (4)</th><th>Verbal (5)</th><th>Motor (6)</th></tr>
<tr><td>4 Spontaneous<br>3 To voice<br>2 To pain<br>1 None</td>
<td>5 Oriented<br>4 Confused<br>3 Inappropriate words<br>2 Sounds<br>1 None</td>
<td>6 Obeys<br>5 Localizes<br>4 Withdraws<br>3 Flexion<br>2 Extension<br>1 None</td></tr></table>
<p>Severe TBI ≤8 · Moderate 9–12 · Mild 13–15. Intubate for GCS ≤8.</p>`},
{t:"Imaging in Trauma (radiologist's corner)",h:`
<ul>
<li>eFAST in the bay: pericardium, RUQ, LUQ, pelvis ± lung sliding.</li>
<li>Hemodynamically <b>unstable + positive FAST</b> → OR, not CT.</li>
<li>Stable blunt trauma → whole-body CT with IV contrast; arterial + portal venous phases for solid organ/vascular injury grading (AAST).</li>
<li>CT cystogram for gross hematuria + pelvic fracture; CTA neck per Denver/Memphis criteria for blunt cerebrovascular injury.</li>
</ul>`}]},

acr:{name:"Contrast Reactions",tag:"red",blurb:"Outpatient contrast policy (2026 manual) + ACR/AAAAI 2025 consensus: reactions, prior reactors, pregnancy, renal.",
sections:[
{t:"Recognize & Classify",h:`
<p>Every reaction is sorted two ways: <b>allergic-like vs physiologic</b>, and <b>mild / moderate / severe</b>. Severity of the reaction drives treatment now and where the patient is scanned next time.</p>
<div class="tblwrap"><table><tr><th>Severity</th><th>Allergic-like</th><th>Physiologic</th></tr>
<tr><td><b>Mild</b><br>self-limited, no progression</td><td>Limited urticaria/pruritus, cutaneous edema, itchy or scratchy throat, nasal congestion, sneezing, conjunctivitis, rhinorrhea</td><td>Limited nausea/vomiting, flushing, warmth, chills, headache, dizziness, anxiety, altered taste, mild hypertension, vasovagal that resolves on its own</td></tr>
<tr><td><b>Moderate</b><br>usually needs treatment</td><td>Diffuse urticaria/pruritus, diffuse erythema with stable vitals, facial edema without dyspnea, throat tightness or hoarseness without dyspnea, wheezing with mild or no hypoxia</td><td>Protracted nausea/vomiting, hypertensive urgency, isolated chest pain, vasovagal that needs and responds to treatment</td></tr>
<tr><td><b>Severe</b><br>life-threatening</td><td>Diffuse or facial edema with dyspnea, diffuse erythema with hypotension, laryngeal edema with stridor and/or hypoxia, wheezing with significant hypoxia, anaphylactic shock (hypotension + tachycardia)</td><td>Vasovagal resistant to treatment, arrhythmia, seizure, hypertensive emergency</td></tr></table></div>
<h3>First 60 seconds</h3>
<ul>
<li>Stop the injection at the first sign of a reaction; notify the supervising physician.</li>
<li>Assess: how the patient looks, whether they can speak and how the voice sounds, breathing, vital signs.</li>
<li>Keep the IV in place until discharge.</li>
</ul>
<div class="warn"><b>Vasovagal vs anaphylaxis:</b> vasovagal brings bradycardia from the outset and no skin findings; anaphylaxis usually brings tachycardia plus urticaria, flushing, or angioedema. Immediate reactions start within 1 hour; delayed reactions appear hours to a week later and are almost always cutaneous.</div>`},
{t:"Treatment by Reaction (adult)",h:`
<div class="policy"><b class="lbl">Outpatient epinephrine rule</b>Auto-injector only: ${D("EpiPen 0.3 mg IM")}, anterolateral thigh, repeat every 5–15 min up to 3 times. <b>Call 911 any time an EpiPen is used.</b></div>
<h3>Hives (urticaria)</h3>
<div class="sevgrid">
<div class="sevcard"><span class="sev mild">Mild</span><ul><li>Often no treatment needed.</li><li>If symptomatic, first line: <b>cetirizine (Zyrtec)</b> ${D("10 mg PO")}</li><li>Alternative: diphenhydramine (Benadryl) ${D("25–50 mg PO")}</li></ul></div>
<div class="sevcard"><span class="sev mod">Moderate</span><ul><li>Monitor vitals, preserve IV access.</li><li><b>Cetirizine</b> ${D("10 mg PO")}</li><li>or diphenhydramine ${D("25–50 mg PO")}</li><li>or diphenhydramine ${D("50 mg IM or IV")} (IV slowly over 1–2 min)</li></ul></div>
<div class="sevcard"><span class="sev sv">Severe</span><ul><li>Widespread and/or progressive: monitor vitals, preserve IV access.</li><li>Diphenhydramine ${D("50 mg IM or IV")} (IV slowly over 1–2 min)</li></ul></div>
</div>
<ul>
<li>After any antihistamine: observe ${D("30 min")}, vitals (SpO₂, pulse, BP) every ${D("15 min")}.</li>
<li><b>Cetirizine</b> and no drowsiness → may drive home after the 30 minutes. <b>Diphenhydramine</b> → must have a driver.</li>
<li>Diphenhydramine IM/IV can cause or worsen hypotension.</li>
</ul>
<h3>Diffuse erythema</h3>
<ul><li>Vitals, pulse oximeter, O₂ by mask ${D("6–10 L/min")}.</li>
<li>Normotensive: no other treatment usually needed.</li>
<li>Hypotensive: 0.9% saline or lactated Ringer’s ${D("1,000 mL rapidly")}. Profound or unresponsive to fluids → <b>EpiPen</b> ${D("0.3 mg IM")} <span class="k911">CALL 911</span></li></ul>
<h3>Bronchospasm</h3>
<ul><li>O₂ by mask ${D("6–10 L/min")}.</li>
<li>Mild: albuterol inhaler ${D("2 puffs (180 mcg)")}, can repeat up to 3 times; consider 911 if response is incomplete.</li>
<li>Moderate: albuterol as above; consider adding <b>EpiPen</b> ${D("0.3 mg IM")} <span class="k911">CALL 911</span></li>
<li>Severe: <b>EpiPen</b> ${D("0.3 mg IM")} <span class="k911">CALL 911</span> and albuterol (may work synergistically).</li></ul>
<h3>Laryngeal edema</h3>
<ul><li>O₂ by mask ${D("6–10 L/min")}. <b>EpiPen</b> ${D("0.3 mg IM")}, repeat every 5–15 min up to 3 times <span class="k911">CALL 911</span></li>
<li>Antihistamines treat skin findings only. They do not treat the airway.</li></ul>
<h3>Hypotension (SBP &lt; 90)</h3>
<ul><li>All: O₂ ${D("6–10 L/min")}, legs elevated at least 60°, saline or LR ${D("1,000 mL rapidly")}.</li>
<li><b>With bradycardia (&lt; 60), vasovagal:</b> mild needs nothing more. Still symptomatic → atropine ${D("0.6–1 mg IV")} into running fluids, repeat to ${D("3 mg total")} <span class="k911">CALL 911</span></li>
<li><b>With tachycardia (&gt; 100), anaphylactoid:</b> if hypotension persists → <b>EpiPen</b> ${D("0.3 mg IM")} <span class="k911">CALL 911</span></li></ul>
<h3>Hypertensive crisis</h3>
<ul><li>DBP &gt; 120, SBP &gt; 200, or end-organ symptoms: O₂, nitroglycerin ${D("0.4 mg SL")} every 5–10 min <span class="k911">CALL 911</span></li></ul>
<h3>Pulmonary edema</h3>
<ul><li>O₂ ${D("6–10 L/min")}, elevate head of bed <span class="k911">CALL 911</span></li></ul>
<h3>Seizure</h3>
<ul><li>Observe and protect, turn to the side, suction as needed, O₂ ${D("6–10 L/min")} <span class="k911">CALL 911</span></li></ul>
<div class="crit"><b>After suspected anaphylaxis:</b> send the patient to the emergency department. Biphasic anaphylaxis occurred in about 10% of contrast anaphylaxis cases in one series, recurring up to 72 h later (mean 11 h). Delayed epinephrine is the risk factor for bad outcomes; glucocorticoids have no role in acute treatment.</div>
<div class="warn"><b>Hospital setting only:</b> weight-based IM epinephrine ${D("0.01 mg/kg of 1 mg/mL, max 0.5 mg")}; IV epinephrine infusion (0.1 mg/mL) is reserved for protracted anaphylaxis with cardiac monitoring. Outpatient carts stock the auto-injector only.</div>
<p class="sub">Children: outpatient centers do not give contrast to children under 30 kg; over 30 kg use the adult EpiPen. Pediatric hives: diphenhydramine ${D("1 mg/kg, max 50 mg")}.</p>`},
{t:"Prior Reactors & Premedication",h:`
<p>The steroid + antihistamine regimen is retired for outpatient imaging. What the patient gets depends on the severity of the <b>prior</b> reaction.</p>
<div class="sevgrid">
<div class="sevcard"><span class="sev mild">Prior mild</span>
<ul><li>Outpatient scan is fine. Technologist alerts the supervising physician before injection.</li>
<li><b>Offer an alternative contrast agent</b> when the inciting agent is known and switching is feasible.</li>
<li><b>No premedication is necessary.</b></li>
<li>Or: <b>cetirizine (Zyrtec)</b> ${D("10 mg PO, 1 h before the exam")}.</li></ul></div>
<div class="sevcard"><span class="sev mod">Prior moderate</span><ul><li>Scan at a <b>hospital location</b>.</li><li>Consensus: shared decision-making on premedication; switch agent when feasible.</li></ul></div>
<div class="sevcard"><span class="sev sv">Prior severe</span><ul><li>Scan at a <b>hospital location</b> with a rapid response team.</li><li>Consensus: consider alternative imaging first. If contrast is needed, premedicate and switch agent when feasible.</li></ul></div>
</div>
<ul><li>Children with a known contrast allergy: hospital facility.</li>
<li>Moderate or severe reactors should be referred to an allergy specialist.</li></ul>
<h3>No premedication for</h3>
<ul><li>Prior physiologic or chemotoxic reactions (nausea, warmth, vasovagal).</li>
<li>Shellfish or seafood allergy, “iodine allergy,” topical povidone-iodine reactions. Iodine is not an allergen.</li>
<li>Prior delayed reactions: no evidence premedication helps. A severe cutaneous adverse reaction (SJS/TEN, DRESS, AGEP) means avoid iodinated contrast.</li></ul>
<h3>Why switching beats steroids</h3>
<div class="tblwrap"><table><tr><th>Re-exposure strategy (McDonald et al., 1,973 patients)</th><th>Breakthrough</th></tr>
<tr><td>Same agent, no premedication</td><td>25%</td></tr>
<tr><td>Same agent + steroid premedication</td><td>26%</td></tr>
<tr><td>Different agent, no premedication</td><td>6%</td></tr>
<tr><td>Different agent + premedication</td><td>3%</td></tr></table></div>
<ul><li>Meta-analysis (6 studies, 7,155 patients): switching agents cut breakthrough reactions by 61%.</li>
<li>Steroid/diphenhydramine costs: diagnostic delay, transient hyperglycemia, sedation and the need for a driver.</li>
<li>When premedication is used, about 2% still break through, and nearly half of those are moderate or severe.</li></ul>
<div class="warn"><b>Hospital reference (severe prior reaction, contrast unavoidable):</b> prednisone ${D("50 mg PO at 13, 7, 1 h")} or methylprednisolone ${D("32 mg PO at 12 and 2 h")}, with or without an antihistamine. Not used at outpatient centers.</div>`},
{t:"Extravasation",h:`
<ol>
<li>Stop the injection. Notify the supervising physician.</li>
<li>Estimate the volume (injector reading, syringes, the site, the images). Record agent, volume, and lot number.</li>
<li>Remove the catheter, apply a <b>warm or cold compress</b>, and elevate the limb above the heart.</li>
<li>Outline the area with a permanent marker to track change.</li>
<li>Observe as long as the supervising physician orders; release only when symptoms have improved and nothing new has developed.</li>
<li>Give written discharge instructions; follow-up call in ${D("24–48 h")}.</li>
</ol>
<div class="crit"><b>Send for emergency or surgical evaluation:</b> progressive pain or swelling, blistering or ulceration, pallor, coolness or cyanosis below the site, numbness or tingling, decreased range of motion. These suggest compartment syndrome.</div>
<p class="sub">Home care: elevate above the heart as often as possible for 24–48 h; compress 15–20 min, 4–5 times a day for 48 h.</p>`},
{t:"Kidneys, Metformin & Dialysis",h:`
<h3>Iodinated contrast: who needs a creatinine</h3>
<ul><li>Only patients with a risk factor and no creatinine within ${D("30 days")}: diabetes, renal disease (CKD, prior AKI, albuminuria), dialysis, renal cancer, renal ablation/surgery/transplant, metformin.</li>
<li>No risk factor → no baseline creatinine needed.</li></ul>
<div class="tblwrap"><table><tr><th>eGFR</th><th>Risk</th><th>Action</th></tr>
<tr><td>${D("≥ 30")}</td><td>Low</td><td>No change</td></tr>
<tr><td>${D("< 30")}</td><td>Higher</td><td>Not an absolute contraindication. Radiologist decides if non-contrast is diagnostic; IV contrast needs ordering physician or nephrology approval.</td></tr></table></div>
<ul><li>Do <b>not</b> reduce the contrast dose to protect the kidneys; it risks a nondiagnostic exam.</li>
<li>No 24-hour maximum dose threshold; no creatinine needed between closely spaced studies.</li></ul>
<h3>Metformin (iodinated contrast only)</h3>
<ul><li><b>Category 1</b> (no AKI, eGFR ≥ 30): continue metformin. No need to recheck renal function.</li>
<li><b>Category 2</b> (AKI or eGFR &lt; 30): stop at or before the procedure, hold ${D("48 h")} after, restart once renal function is confirmed stable.</li>
<li>Gadolinium: no need to stop metformin.</li></ul>
<h3>Dialysis</h3>
<ul><li>Continue the routine dialysis schedule; dialysis within 24 h of contrast is not required (iodinated or gadolinium).</li>
<li>Anuric, no functioning transplant: iodinated contrast carries no risk of further renal damage.</li>
<li>Still making urine: treat as eGFR &lt; 30.</li></ul>
<h3>Gadolinium</h3>
<ul><li>Group II agents only. At standard doses, no renal questionnaire or lab testing is needed.</li>
<li>A prior gadolinium reaction does not predict an iodinated reaction, and vice versa.</li></ul>`},
{t:"Pregnancy, Breastfeeding & Fasting",h:`
<div class="policy"><b class="lbl">Gadolinium in pregnancy · company stance</b>Outpatient facilities do <b>not</b> give gadolinium-based contrast to pregnant patients. If the exam is so strongly indicated that contrast must be given, the patient is scanned at a <b>hospital location</b>.</div>
<ul><li>Why: gadolinium crosses the placenta and can accumulate in amniotic fluid. No detrimental fetal effect is proven, so it is reserved for cases with no alternative.</li>
<li>Workflow: technologist notifies the supervising physician, who confers with the ordering physician.</li></ul>
<h3>Iodinated contrast in pregnancy</h3>
<ul><li>Do not withhold when it is needed for diagnosis. If the ordering provider knows about the pregnancy and judges the exam necessary, perform it as ordered.</li></ul>
<h3>Breastfeeding (iodinated or gadolinium)</h3>
<ul><li>Safe to continue. The infant absorbs a tiny fraction (for gadolinium, less than 0.0004% of the maternal dose).</li>
<li>If the patient remains concerned: pump and discard for ${D("24 h")}.</li></ul>
<h3>Fasting</h3>
<ul><li>No NPO requirement for IV iodinated or gadolinium contrast. Do not delay or reschedule for fasting status.</li>
<li>Exceptions: CT or MR enterography, exams with sedation or anesthesia, or physician direction.</li></ul>`}]},

sed:{name:"Moderate Sedation",tag:"green",blurb:"Drugs, monitoring, MOAA/S, reversal agents, pre-procedure assessment.",
sections:[
{t:"Definitions & Pre-Procedure",h:`
<table><tr><th>Level</th><th>Response</th><th>Airway</th></tr>
<tr><td>Minimal</td><td>Normal to voice</td><td>Unaffected</td></tr>
<tr><td><b>Moderate</b></td><td>Purposeful to voice/light touch</td><td>No intervention needed</td></tr>
<tr><td>Deep</td><td>Purposeful after repeated/painful stimulus</td><td>May need support</td></tr>
<tr><td>GA</td><td>Unarousable</td><td>Often required</td></tr></table>
<ul>
<li><b>NPO:</b> clear liquids ${D("2 h")}, light meal ${D("6 h")}, fatty meal ${D("8 h")}.</li>
<li>Airway exam (Mallampati, neck mobility, dentition), ASA class, OSA screen (STOP-BANG).</li>
<li>ASA III–IV, difficult airway, severe OSA → consider anesthesiology.</li>
</ul>`},
{t:"Drugs & Dosing (adult)",h:`
<h3>Midazolam</h3>
<ul><li>${D("0.5–2 mg IV")} over ≥2 min; titrate ${D("q2–5 min")}; typical total 2–5 mg. Reduce in elderly (start ${D("0.5 mg")}) and with opioids.</li></ul>
<h3>Fentanyl</h3>
<ul><li>${D("25–50 mcg IV")}; titrate q2–5 min; typical total 50–150 mcg. Synergistic respiratory depression with benzos — titrate one drug at a time.</li></ul>
<h3>Reversal</h3>
<ul><li><b>Naloxone</b> (opioid): ${D("0.04–0.4 mg IV")} q2–3 min titrated to respiration (duration shorter than fentanyl — observe for re-sedation ≥2 h).</li>
<li><b>Flumazenil</b> (benzo): ${D("0.2 mg IV over 15 s")}, repeat q1 min to ${D("1 mg max")}. Avoid in chronic benzo use / seizure history. Observe ≥2 h.</li></ul>
<div class="warn">If reversal agents are used, extend recovery monitoring — re-sedation outlasts the antagonist.</div>`},
{t:"Monitoring & MOAA/S",h:`
<ul>
<li>Continuous SpO₂ + <b>capnography</b> (detects hypoventilation before desaturation), HR/ECG, BP at least ${D("q5 min")}, level of consciousness.</li>
<li>Dedicated trained observer; emergency cart + suction + airway equipment + reversal agents in room.</li>
</ul>
<table><tr><th>MOAA/S</th><th>Response</th></tr>
<tr><td>5</td><td>Responds readily to name (normal)</td></tr>
<tr><td>4</td><td>Lethargic response to name</td></tr>
<tr><td>3</td><td>Responds after name called loudly/repeatedly</td></tr>
<tr><td>2</td><td>Responds to mild prodding/shaking</td></tr>
<tr><td>1</td><td>Responds only to painful stimulus</td></tr>
<tr><td>0</td><td>No response to pain</td></tr></table>
<p>Target for moderate sedation: <b>MOAA/S 3–4</b>.</p>`},
{t:"Rescue & Recovery",h:`
<ol>
<li>Apnea/obstruction: stop drugs → stimulate → jaw thrust/chin lift → 100% O₂ → bag-mask → oral/nasal airway → reversal agents → call anesthesia/code.</li>
<li>Hypotension: fluids; consider drug effect vs vagal vs bleeding.</li>
<li>Discharge: Aldrete ≥9 (or return to baseline), stable vitals ×30 min after last drug (longer after reversal), responsible adult escort, written instructions.</li>
</ol>`}]}
};

/* =========================================================
   QUICK REFERENCE (emergency mode) — protocol data
   ========================================================= */
function pd(mgkg,maxmg,unit){ // peds dose calc string
  const w=state.weight;
  if(!w) return "";
  let v=mgkg*w; if(maxmg&&v>maxmg)v=maxmg;
  const r=v<1?v.toFixed(2):(v<10?v.toFixed(1):Math.round(v));
  return ` <span class="calc">→ ${r} ${unit} @ ${w} kg</span>`;
}

function render(){

/* ---------------- TRAIN (scenarios) ---------------- */
function renderTrain(){

    const cats=["All","ACLS","PALS","ATLS","Contrast","Sedation"];

    const list=SCN.filter(s=>sc.cat==="All"||s.cat===sc.cat);
    app.innerHTML=`<h1>Training Scenarios</h1>
    <div class="sub">Work a case step by step. Decisions get immediate, guideline-based feedback.</div>
    <div class="pillrow">${cats.map(c=>`<button class="pill ${sc.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
    <button class="btn primary" id="rand">▶ Random scenario</button>
    ${list.map((s,i)=>`<button class="tile" style="width:100%;margin:8px 0" data-t="${s.title}">
      <span class="tag ${s.cat==="ACLS"?"teal":s.cat==="PALS"?"blue":s.cat==="ATLS"?"amber":s.cat==="Contrast"?"red":"green"}">${s.cat}</span>
      <b>${s.title}</b><span>${s.q.length} decision point${s.q.length>1?"s":""}</span></button>`).join("")}`;
    app.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{sc.cat=b.dataset.c;render()}));
    $("#rand").addEventListener("click",()=>startScn(list[Math.floor(Math.random()*list.length)]));
    app.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>startScn(SCN.find(s=>s.title===b.dataset.t))));
    return;
  }
  const s=sc.active,q=s.q[sc.qi],done=sc.qi>=s.q.length;
  if(done){
    const pct=Math.round(100*sc.score/s.q.length);
    app.innerHTML=`<button class="back" id="bk">‹ Scenarios</button>
    <div class="card" style="text-align:center;padding:28px">
    <div class="score" style="color:${pct>=80?"var(--green)":pct>=50?"var(--amber)":"var(--red)"}">${pct}%</div>
    <p><b>${s.title}</b></p><p class="sub">${sc.score} of ${s.q.length} first-attempt decisions correct</p>
    <button class="btn primary" id="again">Replay scenario</button>
    <button class="btn ghost" id="next">Next random scenario</button></div>`;
    $("#bk").addEventListener("click",()=>{sc.active=null;render()});
    $("#again").addEventListener("click",()=>startScn(s));
    $("#next").addEventListener("click",()=>{const pool=SCN.filter(x=>x!==s);startScn(pool[Math.floor(Math.random()*pool.length)])});
    return;
  }
  app.innerHTML=`<button class="back" id="bk">‹ Exit scenario</button>
  <span class="tag ${s.cat==="ACLS"?"teal":s.cat==="PALS"?"blue":s.cat==="ATLS"?"amber":s.cat==="Contrast"?"red":"green"}">${s.cat}</span>
  <h1 style="font-size:21px;margin-top:6px">${s.title}</h1>
  <div class="progress"><i style="width:${100*sc.qi/s.q.length}%"></i></div>
  <div class="card"><p>${s.stem}</p>
  <div class="vitals">${Object.entries(s.vit).filter(([k])=>k!=="Other").map(([k,v])=>`<div class="vt"><b>${v}</b><span>${k}</span></div>`).join("")}</div>
  ${s.vit.Other?`<p class="sub" style="margin:4px 0 0">${s.vit.Other}</p>`:""}</div>
  <div class="eyebrow">Decision ${sc.qi+1} of ${s.q.length}</div><p class="qtext">${q.q}</p>
  <div id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
  <div id="fb"></div>`;
  $("#bk").addEventListener("click",()=>{sc.active=null;render()});
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(sc.answered)return;
    sc.answered=true;
    const i=+b.dataset.i,ok=i===q.c;
    if(ok)sc.score++;
    app.querySelectorAll(".opt").forEach((x,xi)=>{
      if(xi===q.c)x.classList.add("right");
      else if(xi===i)x.classList.add("wrong");
    });
    $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Correct.":"Not quite."}</b> ${q.fb}</div>
    <button class="btn primary" id="cont">${sc.qi+1<s.q.length?"Continue ›":"See results"}</button>`;
    $("#cont").addEventListener("click",()=>{sc.qi++;sc.answered=false;render();window.scrollTo(0,0)});
  }));
}
function startScn(s){state.scn={active:s,qi:0,score:0,answered:false,cat:state.scn.cat};render();window.scrollTo(0,0)}

/* ---------------- CARDS ---------------- */
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function renderCards(){
  const f=state.fc;
  const cats=["All","ACLS","PALS","ATLS","Contrast","Sedation"];
  const deck=FC.map((c,i)=>({i,cat:c[0],q:c[1],a:c[2]})).filter(c=>f.cat==="All"||c.cat===f.cat);
  if(!f.order||f.order.length!==deck.length)f.order=deck.map((_,i)=>i);
  if(f.i>=deck.length)f.i=0;
  const card=deck[f.order[f.i]];
  app.innerHTML=`<h1>Flashcards</h1>
  <div class="sub">Tap a card to flip. ${deck.length} cards in this deck.</div>
  <div class="pillrow">${cats.map(c=>`<button class="pill ${f.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
  <div class="fc-meta"><span>Card ${f.i+1} / ${deck.length}</span><span class="tag ${card.cat==="ACLS"?"teal":card.cat==="PALS"?"blue":card.cat==="ATLS"?"amber":card.cat==="Contrast"?"red":"green"}">${card.cat}</span></div>
  <div class="fc-stage"><div class="fc ${f.flip?"flip":""}" id="fc">
    <div class="fc-face"><div class="q">${card.q}</div><span class="sub">tap to reveal</span></div>
    <div class="fc-face b"><div class="a">${card.a}</div></div>
  </div></div>
  <div class="row"><button class="btn ghost" id="pv">‹ Back</button><button class="btn primary" id="nx">Next ›</button></div>
  <button class="btn ghost" id="sh">⤮ Shuffle deck</button>`;
  app.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{f.cat=b.dataset.c;f.i=0;f.flip=false;f.order=null;render()}));
  $("#fc").addEventListener("click",()=>{f.flip=!f.flip;$("#fc").classList.toggle("flip")});
  $("#nx").addEventListener("click",()=>{f.i=(f.i+1)%deck.length;f.flip=false;render()});
  $("#pv").addEventListener("click",()=>{f.i=(f.i-1+deck.length)%deck.length;f.flip=false;render()});
  $("#sh").addEventListener("click",()=>{f.order=shuffle(f.order);f.i=0;f.flip=false;render()});
}

/* ---------------- QUICK REF (emergency mode) ---------------- */
function renderQuick(qrId){
  const proto=qrId?QR.find(x=>x.id===qrId):null;
  if(proto&&proto.calc){renderNIHSS();return}
  const inner=qrId?(()=>{const p=proto;
    return `<button class="em-close" id="bk" style="margin-bottom:8px">‹ All protocols</button>
    <div class="em-title" style="margin-bottom:2px">${p.name}</div>
    <div class="em-sub">${p.sub}</div>
    ${p.wt?wtBar():""}
    <div class="em-card"><h3>Protocol</h3>${p.steps().map((s,i)=>`<div class="em-step"><span class="n">${i+1}</span><span>${s}</span></div>`).join("")}</div>
    <p class="em-note">Reference aid only. Follow institutional protocols and clinical judgment. Unofficial; not endorsed by Lumexa Imaging.</p>`})()
  :`<div class="em-head"><div class="em-title">Quick Reference</div><button class="em-close" id="bk">Exit</button></div>
    <div class="em-sub">Tap the scenario in front of you.</div>
    ${wtBar()}
    ${QR.map(p=>`<button class="em-btn" data-id="${p.id}">${p.name}<small>${p.sub}</small></button>`).join("")}`;
  app.innerHTML="";
  let w=$(".em-wrap");
  if(!w){w=document.createElement("div");w.className="em-wrap";document.body.appendChild(w)}
  w.innerHTML=`<div class="inner">${inner}</div>`;
  w.scrollTop=0;
  const bk=w.querySelector("#bk");
  bk.addEventListener("click",()=>{ if(qrId){renderQuick()} else {w.remove();setTab("learn")} });
  w.querySelectorAll(".em-btn").forEach(b=>b.addEventListener("click",()=>renderQuick(b.dataset.id)));
  const wi=w.querySelector("#wt");
  if(wi){wi.addEventListener("input",()=>{const v=parseFloat(wi.value);state.weight=(v>0&&v<300)?v:null;store.set("wt",state.weight);
    /* re-render dose calcs without losing focus context */ });
    wi.addEventListener("change",()=>renderQuick(qrId));
    wi.addEventListener("blur",()=>renderQuick(qrId));}
}
function wtBar(){return `<div class="wt-bar"><label>Patient weight (peds dosing)</label>
<input id="wt" type="number" inputmode="decimal" placeholder="kg" value="${state.weight||""}"><label>kg</label></div>`}

/* ---- NIHSS calculator screen ---- */
function renderNIHSS(){
  if(!state.nihss)state.nihss=Array(NIHSS.length).fill(null);
  app.innerHTML="";
  let w=$(".em-wrap");
  if(!w){w=document.createElement("div");w.className="em-wrap";document.body.appendChild(w)}
  w.innerHTML=`<div class="inner">
  <button class="em-close" id="bk" style="margin-bottom:8px">‹ All protocols</button>
  <div class="em-title">NIHSS Calculator</div>
  <div class="em-sub">Tap the finding for each item. Score totals live below.</div>
  <div class="nih-score" id="scorebar"></div>
  ${NIHSS.map((it,i)=>`<div class="em-card" style="padding:12px"><h3 style="margin-bottom:6px">${it.n}</h3>
    <div class="nih-opts" data-item="${i}">
    ${it.o.map((o,j)=>`<button class="nih-opt" data-i="${i}" data-v="${j}">${o}</button>`).join("")}
    </div></div>`).join("")}
  <button class="em-btn center" id="reset">Reset all items</button>
  <p class="em-note">Severity bands: 0 none · 1–4 minor · 5–15 moderate · 16–20 moderate–severe · 21–42 severe. Untested/amputation items: score 0 here and document per NIHSS rules.</p>
  </div>`;
  w.scrollTop=0;
  const upd=()=>{
    const vals=state.nihss,sum=vals.reduce((a,v)=>a+(v||0),0),n=vals.filter(v=>v!==null).length;
    $("#scorebar").innerHTML=`<b>${sum}</b><span>${n}/${NIHSS.length} items · ${nihssSeverity(sum)}${n<NIHSS.length?" (incomplete)":""}</span>`;
  };
  upd();
  // restore prior selections
  state.nihss.forEach((v,i)=>{if(v!==null){const b=w.querySelector(`.nih-opt[data-i="${i}"][data-v="${v}"]`);if(b)b.classList.add("on")}});
  w.querySelectorAll(".nih-opt").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i,v=+b.dataset.v;
    state.nihss[i]=v;
    w.querySelectorAll(`.nih-opt[data-i="${i}"]`).forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    upd();
  }));
  $("#reset").addEventListener("click",()=>{state.nihss=Array(NIHSS.length).fill(null);renderNIHSS()});
  w.querySelector("#bk").addEventListener("click",()=>renderQuick());
}

/* ---------------- boot ---------------- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
render();
</script>
